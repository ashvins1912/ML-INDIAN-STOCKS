services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quant_dev_password}
      POSTGRES_DB: quant_db
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant_db"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
  influxdb:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER:-quant_admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-quant_dev_password}
      DOCKER_INFLUXDB_INIT_ORG: quant_org
      DOCKER_INFLUXDB_INIT_BUCKET: market_raw
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-dev-influx-token-change-me}
    ports: ["8086:8086"]
    volumes: [influxdata:/var/lib/influxdb2]
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: bash -c "airflow db migrate && airflow users create --username admin --password $${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname Admin --lastname Quant --role Admin --email admin@example.local || true"
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://quant:${POSTGRES_PASSWORD:-quant_dev_password}@postgres/airflow_db
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: webserver
    environment: *airflow-env
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    ports: ["8080:8080"]
    volumes: ["./dags:/opt/airflow/dags", "./app:/opt/airflow/app"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: scheduler
    environment: *airflow-env
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    volumes: ["./dags:/opt/airflow/dags", "./app:/opt/airflow/app"]
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://quant:${POSTGRES_PASSWORD:-quant_dev_password}@postgres/quant_db
      REDIS_URL: redis://redis:6379/0
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: quant_org
      INFLUX_BUCKET: market_raw
      INFLUX_TOKEN: ${INFLUX_TOKEN:-dev-influx-token-change-me}
      FERNET_KEY: ${FERNET_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8501}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      influxdb: {condition: service_healthy}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      API_URL: http://api:8000
    depends_on:
      api: {condition: service_healthy}
    ports: ["8501:8501"]
volumes:
  pgdata:
  redisdata:
  influxdata:
